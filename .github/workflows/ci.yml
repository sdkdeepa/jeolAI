name: JeolAI CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: JeolAI CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GOOGLE_CLOUD_PROJECT: jeolai-ci-test
      GOOGLE_CLOUD_LOCATION: us-central1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov ruff

      - name: Compile Python
        run: python -m compileall -q backend tests

      - name: Run Ruff
        run: ruff check --select E9,F63,F7,F82 backend tests

      - name: Run backend tests
        run: pytest --cov=backend --cov-report=term-missing --cov-report=xml

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: warn

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build